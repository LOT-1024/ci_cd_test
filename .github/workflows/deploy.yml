name: CI/CD Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Deploy to User Web Directory
      run: |
        echo "Deploying index.html to user directory..."
        mkdir -p "$HOME/public_html"
        cp index.html "$HOME/public_html/index.html"
        chmod 644 "$HOME/public_html/index.html"
        echo "Deployment complete successfully!"
